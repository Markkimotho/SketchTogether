apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sketchtogether
  namespace: sketchtogether
  annotations:
    # nginx-ingress — install with:
    #   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
    kubernetes.io/ingress.class: "nginx"

    # WebSocket support — required for Socket.io real-time drawing sync
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

    # TLS via cert-manager + Let's Encrypt — install cert-manager first:
    #   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
    # Then create a ClusterIssuer (see k8s/cert-issuer.yaml).
    # Remove these two lines if you are not using TLS yet.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  # Remove the tls block if you are not using TLS.
  tls:
    - hosts:
        - sketchtogether.yourdomain.com   # <-- replace with your domain
      secretName: sketchtogether-tls

  rules:
    - host: sketchtogether.yourdomain.com  # <-- replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sketchtogether
                port:
                  number: 80
