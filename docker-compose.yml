services:
  sketchtogether:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sketchtogether
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Persist the SQLite database across container restarts
      - sketchtogether-data:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/rooms"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  sketchtogether-data:
    driver: local
